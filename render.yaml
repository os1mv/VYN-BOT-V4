services:
    - type: worker
    name: vyn-god-edition
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py

    envVars:
            - key: BOT_TOKEN
        sync: false

            - key: GROQ_API_KEY
        sync: false

            - key: GROQ_MODEL
        value: openai/gpt-oss-20b

            - key: ADMIN_IDS
        sync: false

            - key: DATABASE_PATH
        value: vyn.db

            - key: WEBAPP_URL
        sync: false

            - key: TAVILY_API_KEY
        sync: false

            - key: REPLICATE_API_TOKEN
        sync: false